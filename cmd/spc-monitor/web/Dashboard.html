<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPC Monitor</title>
<style>
  :root {
    --bg: #0f1419; --card: #1a2029; --text: #e6e8eb; --muted: #8b95a3;
    --line: #5aa9e6; --center: #9aa5b1; --limit: #e5534b; --zone: #2c3440;
    --ok: #3fb950; --bad: #e5534b; --wait: #6e7681; --base: rgba(90,169,230,0.06);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: "Segoe UI", system-ui, sans-serif; }
  header { display: flex; justify-content: space-between; align-items: baseline;
           padding: 18px 28px; border-bottom: 1px solid var(--zone); }
  h1 { margin: 0; font-size: 20px; font-weight: 600; }
  #status { color: var(--muted); font-size: 13px; }
  main { padding: 20px 28px; display: grid; gap: 18px; }
  .card { background: var(--card); border-radius: 10px; padding: 16px 18px; }
  .card-head { display: flex; justify-content: space-between; align-items: center;
               margin-bottom: 8px; }
  .title { font-weight: 600; }
  .title span { color: var(--muted); font-weight: 400; }
  .badge { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px;
           color: #0f1419; }
  .badge.ok { background: var(--ok); }
  .badge.bad { background: var(--bad); }
  .badge.wait { background: var(--wait); color: var(--text); }
  .chart-label { color: var(--muted); font-size: 12px; margin: 8px 0 2px; }
  .chart { width: 100%; height: auto; display: block; }
  .chart .baseline { fill: var(--base); }
  .chart .zone { stroke: var(--zone); stroke-width: 1; }
  .chart .center { stroke: var(--center); stroke-width: 1.5; }
  .chart .limit { stroke: var(--limit); stroke-width: 1.5; stroke-dasharray: 6 4; }
  .chart .series { fill: none; stroke: var(--line); stroke-width: 1.5; }
  .chart .pt { fill: var(--line); }
  .chart .pt.badpt { fill: var(--bad); }
  .chart .lbl { fill: var(--muted); font-size: 11px; }
  .alerts { margin: 10px 0 0; padding: 0; list-style: none; font-size: 13px; }
  .alerts li { color: var(--bad); padding: 2px 0; }
  .note { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
  .empty { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>SPC Monitor</h1>
  <div id="status">Connecting...</div>
</header>
<main id="charts"></main>

<script>
const REFRESH_MS = 2000;
const W = 800, PAD = { l: 50, r: 20 };

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

async function getJSON(url) {
  const r = await fetch(url);
  const body = await r.json();
  if (!r.ok) throw new Error(body.error || r.statusText);
  return body;
}

// Shared x scale, so each MR dot sits directly under the reading where the jump landed.
function xScale(count) {
  return i => PAD.l + (count <= 1 ? 0 : i * (W - PAD.l - PAD.r) / (count - 1));
}

function svgHelpers(y) {
  return {
    hline: (v, cls) => `<line x1="${PAD.l}" x2="${W - PAD.r}" y1="${y(v)}" y2="${y(v)}" class="${cls}"/>`,
    label: (v, text) => `<text x="${W - PAD.r}" y="${y(v) - 4}" text-anchor="end" class="lbl">${text}</text>`,
  };
}

function baselineRect(x, limits, count, top, height) {
  const bx = x(Math.min(limits.n, count) - 1);
  return `<rect x="${PAD.l}" y="${top}" width="${Math.max(bx - PAD.l, 0)}" height="${height}" class="baseline"/>`;
}

function groupByIndex(violations, prefix) {
  const m = new Map();
  for (const v of violations) {
    if (!m.has(v.index)) m.set(v.index, []);
    m.get(v.index).push(`${prefix}Rule ${v.rule}: ${v.description}`);
  }
  return m;
}

function drawIndividuals(values, limits, violations) {
  const H = 260, T = 15, B = 20;
  let lo = Math.min(...values), hi = Math.max(...values);
  if (limits) { lo = Math.min(lo, limits.lcl); hi = Math.max(hi, limits.ucl); }
  const pad = (hi - lo) * 0.08 || 0.01;
  lo -= pad; hi += pad;

  const x = xScale(values.length);
  const y = v => T + (hi - v) * (H - T - B) / (hi - lo);
  const { hline, label } = svgHelpers(y);
  const rulesAt = groupByIndex(violations, "");

  let svg = `<svg viewBox="0 0 ${W} ${H}" class="chart">`;
  if (limits) {
    svg += baselineRect(x, limits, values.length, T, H - T - B);
    for (const k of [-2, -1, 1, 2]) svg += hline(limits.center + k * limits.sigma, "zone");
    svg += hline(limits.ucl, "limit") + hline(limits.lcl, "limit") + hline(limits.center, "center");
    svg += label(limits.ucl, "UCL " + limits.ucl.toFixed(3));
    svg += label(limits.center, "CL " + limits.center.toFixed(3));
    svg += label(limits.lcl, "LCL " + limits.lcl.toFixed(3));
  }
  svg += `<text x="${PAD.l - 6}" y="${T + 10}" text-anchor="end" class="lbl">${hi.toFixed(2)}</text>`;
  svg += `<text x="${PAD.l - 6}" y="${H - B}" text-anchor="end" class="lbl">${lo.toFixed(2)}</text>`;
  svg += `<polyline class="series" points="${values.map((v, i) => `${x(i)},${y(v)}`).join(" ")}"/>`;

  values.forEach((v, i) => {
    const rules = rulesAt.get(i);
    const tip = `#${i}  ${v.toFixed(3)}` + (rules ? "\n" + rules.join("\n") : "");
    svg += `<circle cx="${x(i)}" cy="${y(v)}" r="${rules ? 5 : 2.5}" class="pt${rules ? " badpt" : ""}"><title>${esc(tip)}</title></circle>`;
  });
  return svg + "</svg>";
}

function drawMovingRange(values, limits, mrViolations) {
  const H = 140, T = 12, B = 16;
  const pts = [];
  for (let i = 1; i < values.length; i++) pts.push([i, Math.abs(values[i] - values[i - 1])]);
  const hi = Math.max(limits.mrUcl, ...pts.map(p => p[1])) * 1.1 || 0.01;

  const x = xScale(values.length);
  const y = v => T + (hi - v) * (H - T - B) / hi;
  const { hline, label } = svgHelpers(y);
  const rulesAt = groupByIndex(mrViolations, "MR ");

  let svg = `<svg viewBox="0 0 ${W} ${H}" class="chart">`;
  svg += baselineRect(x, limits, values.length, T, H - T - B);
  svg += hline(0, "zone") + hline(limits.mrUcl, "limit") + hline(limits.mrBar, "center");
  svg += label(limits.mrUcl, "UCL " + limits.mrUcl.toFixed(3));
  svg += label(limits.mrBar, "MR-bar " + limits.mrBar.toFixed(3));
  svg += `<text x="${PAD.l - 6}" y="${T + 10}" text-anchor="end" class="lbl">${hi.toFixed(2)}</text>`;
  svg += `<text x="${PAD.l - 6}" y="${H - B}" text-anchor="end" class="lbl">0</text>`;
  svg += `<polyline class="series" points="${pts.map(([i, m]) => `${x(i)},${y(m)}`).join(" ")}"/>`;

  pts.forEach(([i, m]) => {
    const rules = rulesAt.get(i);
    const tip = `#${i}  jump ${m.toFixed(3)}` + (rules ? "\n" + rules.join("\n") : "");
    svg += `<circle cx="${x(i)}" cy="${y(m)}" r="${rules ? 5 : 2.5}" class="pt${rules ? " badpt" : ""}"><title>${esc(tip)}</title></circle>`;
  });
  return svg + "</svg>";
}

async function renderSeries(s) {
  const q = `station=${encodeURIComponent(s.station)}&characteristic=${encodeURIComponent(s.characteristic)}`;
  const data = await getJSON("/measurements?" + q);
  const values = data.map(m => m.value);

  let limits = null, violations = [], mrViolations = [], note = "";
  try {
    const v = await getJSON("/violations?" + q);
    limits = v.limits;
    violations = v.violations;
    mrViolations = v.mrViolations || [];
  } catch (e) {
    note = e.message;
  }

  const total = violations.length + mrViolations.length;
  let badge;
  if (!limits) badge = `<span class="badge wait">Collecting baseline</span>`;
  else if (total) badge = `<span class="badge bad">${total} alert${total === 1 ? "" : "s"}</span>`;
  else badge = `<span class="badge ok">In control</span>`;

  const all = [
    ...violations.map(v => ({ ...v, tag: "" })),
    ...mrViolations.map(v => ({ ...v, tag: "MR " })),
  ].sort((a, b) => a.index - b.index);
  const recent = all.slice(-5).reverse()
    .map(v => `<li>#${v.index}  ${v.value.toFixed(3)} &mdash; ${v.tag}Rule ${v.rule}: ${esc(v.description)}</li>`).join("");

  let charts = "";
  if (values.length) {
    charts += `<div class="chart-label">Individuals</div>` + drawIndividuals(values, limits, violations);
    if (limits && values.length > 1) charts += `<div class="chart-label">Moving range</div>` + drawMovingRange(values, limits, mrViolations);
  }

  const card = document.createElement("section");
  card.className = "card";
  card.innerHTML = `
    <div class="card-head">
      <div class="title">${esc(s.station)} <span>&middot; ${esc(s.characteristic)} &middot; ${values.length} readings</span></div>
      ${badge}
    </div>
    ${charts}
    ${note ? `<p class="note">${esc(note)}</p>` : ""}
    ${recent ? `<ul class="alerts">${recent}</ul>` : ""}`;
  return card;
}

async function refresh() {
  const status = document.getElementById("status");
  try {
    const series = await getJSON("/series");
    const container = document.getElementById("charts");
    if (series.length === 0) {
      container.innerHTML = `<p class="empty">No data yet. Start the generator to send readings.</p>`;
    } else {
      const cards = await Promise.all(series.map(renderSeries));
      container.replaceChildren(...cards);
    }
    status.textContent = "Updated " + new Date().toLocaleTimeString();
  } catch (e) {
    status.textContent = "Cannot reach server: " + e.message;
  }
}

refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
